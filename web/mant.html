<script>
(function(){
  "use strict";
  var NAV = window.GIABA_NAV = window.GIABA_NAV || {};
  var DEF_TXT = "Tenés una carga a medio hacer";
  var VIG = [], MANUAL = null, LISTO = false;
  function $(id){ return document.getElementById(id); }
  function lsGet(k, f){ try { var v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch (e) { return f; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safe(fn){ try { return fn(); } catch (e) { return false; } }

  /* ---------- API para las páginas: carga a medio hacer ---------- */
  // GIABA_NAV.cargando(true|false|función, texto): la página dice a mano si hay algo sin guardar
  NAV.cargando = function(v, txt){ MANUAL = v ? { v: v, txt: txt } : null; };
  // GIABA_NAV.vigilar(["s-pago"], "Tenés un pago a medio cargar", fn?): mientras alguna de esas pantallas se ve y
  // (se escribió algo en ella desde que se abrió, o fn() da verdadero) → hay carga a medio hacer
  NAV.vigilar = function(pantallas, txt, fn){ var w = { ids: [].concat(pantallas), txt: txt, fn: fn, sucio: false }; VIG.push(w); if (LISTO) observar(w); return w; };
  function nodo(id){ return typeof id === "string" ? $(id) : id; }
  function visible(id){ var n = nodo(id); return !!(n && !n.hidden && n.getClientRects().length); }
  function sucio(){
    if (MANUAL){ var v = typeof MANUAL.v === "function" ? safe(MANUAL.v) : MANUAL.v; if (v) return typeof v === "string" ? v : (MANUAL.txt || DEF_TXT); }
    for (var i = 0; i < VIG.length; i++){
      var w = VIG[i];
      if (!w.ids.some(visible)){ w.sucio = false; continue; }
      if (w.sucio) return w.txt || DEF_TXT;
      if (w.fn){ var r = safe(w.fn); if (r) return typeof r === "string" ? r : (w.txt || DEF_TXT); }
    }
    return "";
  }
  NAV.sucio = sucio;
  function observar(w){
    if (!window.MutationObserver) return;
    w.ids.forEach(function(id){ var n = nodo(id); if (!n) return;
      new MutationObserver(function(){ if (!w.ids.some(visible)) w.sucio = false; }).observe(n, { attributes: true, attributeFilter: ["hidden", "class", "style"] });
    });
  }
  function marcarEscrito(e){
    var t = e.target; if (!t || !t.closest || t.closest("#gnBar,#gnDrw,#gnMdl")) return;
    // buscar no es cargar (ej. el buscador de clientes o de productos)
    if (t.type === "search" || /bus(car|q)?/i.test(t.id || "") || /^\s*buscar/i.test(t.getAttribute && t.getAttribute("placeholder") || "")) return;
    VIG.forEach(function(w){ if (w.ids.some(function(id){ var n = nodo(id); return n && n.contains(t); })) w.sucio = true; });

      var gh = t.closest("[data-gh]"); if (gh){ var gk = gh.getAttribute("data-gh"); ABIERTOS[gk] = ABIERTOS[gk] ? 0 : 1; pintarMenu(); return; }
      var tg = t.closest("[data-tg]"); if (tg){ var tk = tg.getAttribute("data-tg"); ATS[tk] = ATS[tk] ? 0 : 1; pintarMenu(); return; }
      var dd = t.closest("[data-dd]"); if (dd){ var k = dd.getAttribute("data-dd"); DD = DD === k ? null : k; pintarBarra(); return; }

        marcarIr(a.getAttribute("data-gn")); cerrarMenu(); return; }
      return;
    }
    if (DD) cerrarDD();
    // el «‹ Menú» de cada app (link que sale de la página): también avisa
    var bk = t.closest("a.back[href]");
    if (bk){ var hr = bk.getAttribute("href") || ""; if (hr && hr !== "#" && hr.indexOf("javascript:") !== 0){ var tb = sucio(); if (tb){ e.preventDefault(); e.stopPropagation(); aviso(tb, { href: bk.href, gn: "" }); } } }
  }

  /* ---------- arranque ---------- */
  NAV.refrescar = function(){

    var dr = document.createElement("aside"); dr.id = "gnDrw"; dr.setAttribute("aria-label", "Menú"); dr.setAttribute("aria-hidden", "true");
    var md = document.createElement("div"); md.id = "gnMdl"; md.hidden = true;

    document.addEventListener("click", onClick, true);
    document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ cerrarMenu(); cerrarDD(); cerrarMdl(); } });
    if (!cargarPersona()) return;
    pintarBarra(); ponerHB();
    // pantallas que se arman después (cada app pinta sus «‹ …» al cambiar de pantalla)
    if (window.MutationObserver){
      var pend = false;
      new MutationObserver(function(){ if (pend) return; pend = true; (window.requestAnimationFrame || setTimeout)(function(){ pend = false; ponerHB(); }); }).observe(document.body, { childList: true, subtree: true });

    }
  }

})();

     3) Si tarda más de medio segundo: barrita arriba y cartelito «Cargando…» abajo, para que se note que la app está haciendo algo.

<style>

<script>
(function () {
  if (window.__gbBotones) return; window.__gbBotones = true;
  var ULT = null, PEND = 0, TBAR = null;

  function barra() { var b = document.getElementById('gbBarra'); if (!b) { b = document.createElement('div'); b.id = 'gbBarra'; document.body.appendChild(b); } return b; }

  // 1) feedback al toque
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest(SEL) : null; if (!t) return;
    if (t.classList.contains('gb-busy')) {   // ya está trabajando: no dos veces

      var desde = +(t.getAttribute('data-gb-desde') || 0);

  }, true);
  // 09/11 (Lucas): en el inicio (elegir usuario / PIN) no se muestra nada: recién después de iniciar sesión
  function enLogin() { var ids = ['screen-quien', 'screen-pin', 'screen-login', 's-login', 's-pin']; for (var i = 0; i < ids.length; i++) { var x = document.getElementById(ids[i]); if (x && x.offsetParent !== null && getComputedStyle(x).display !== 'none' && !x.hidden) return true; } return false; }
  function empezar(el) {
    PEND++;
    if (el && document.body.contains(el)) { el.classList.add('gb-busy'); el.setAttribute('aria-busy', 'true'); el.setAttribute('data-gb-desde', String(Date.now())); }
    if (PEND === 1) { clearTimeout(TBAR); TBAR = setTimeout(function () { if (PEND > 0) { barra().classList.add('on'); var ra = document.getElementById('rcAct'); if (ra && !ra.hidden) return; /* 22/11 (Lucas: dos «cargando» a la vez): si arriba ya dice «↻ actualizando…», no se suma el cartel de abajo */ var c = cartel(); c.textContent = (el && /guard|registr|pag|cerr|confirm|factur|anul|retir|entreg|cobr|abr/i.test(el.textContent || '')) ? 'Guardando…' : 'Cargando…'; c.classList.add('on'); } }, 500); }
  }

  }
  // 2) engancharse a google.script.run (sin cambiar cómo lo usan las pantallas)
  var DUP = {};
  function gbCopia(x) { try { return x === undefined ? x : JSON.parse(JSON.stringify(x)); } catch (e) { return x; } }   // cada pantalla recibe su copia
  function envolver(run, ok, fail) {
    return new Proxy(run, { get: function (o, k) {
      if (k === 'withSuccessHandler') return function (f) { return envolver(o, f, fail); };
      if (k === 'withFailureHandler') return function (f) { return envolver(o, ok, f); };

      var fn = o[k]; if (typeof fn !== 'function') return fn;
      return function () {
        // 12/11 (lentitud): la misma lectura (get…, mismos datos) pedida varias veces a la vez se pide UNA sola vez a Google
        // y la respuesta les llega a todas (solo mientras está en camino: lo que se pide después siempre va a Google). Las que guardan algo nunca se juntan.
        var args = [].slice.call(arguments), clave = null, okL = ok, failL = fail;
        if (/^get/.test(String(k))) { try { clave = String(k) + '|' + JSON.stringify(args); } catch (e) { clave = null; } }
        else DUP = {};   // algo que guarda: lo que se leyó antes ya no sirve (la próxima lectura va a Google de nuevo)
        if (clave) {
          var D = DUP[clave];
          if (D && D.vuela) {
            D.esperan.push([okL, failL]);
            return;
          }

          failL = function (a, b) { D.vuela = false; D.t = 0; D.err = true; D.res = a; if (DUP[clave] === D) delete DUP[clave]; var E = D.esperan; D.esperan = []; if (fail0) fail0(a, b); E.forEach(function (x) { try { if (x[1]) x[1](a); } catch (e) {} }); };
        }
        var el = ULT && Date.now() - ULT.t < 600 ? ULT.el : null, listo = false;
        if (el) ULT = null;   // un toque marca una sola llamada (la primera)
        var calla = enLogin();   // en el inicio (usuario / PIN) no se muestra nada
        var fin = function () { if (listo) return; listo = true; clearTimeout(tope); if (!calla) terminar(el); };
        var tope = setTimeout(fin, 45000);   // por las dudas: nunca queda trabado
        if (!calla) empezar(el);
        var r = o;
        r = r.withSuccessHandler(function (a, b) { fin(); if (okL) return okL(a, b); });
        r = r.withFailureHandler(function (a, b) { fin(); if (failL) return failL(a, b); });

    } });

      const pronto = D.items.filter(x => x.d !== null && x.d <= 31);
      h += `<h1>🛠️ Mantenimiento<button class="mas" data-a="nuevo" aria-label="Agregar">＋</button></h1><div class="grp">Vence pronto</div>`;
      h += pronto.length ? pronto.map(x => `<button class="it" data-i="${esc(x.id)}"><span class="e">${emo(x)}</span><span class="t"><b>${nom(x)}</b><span>${subDe(x)}${x.est ? ' · <span class="est">estimado</span>' : ""}</span></span>${pill(x)}</button>`).join("") : '<div class="okb">Nada para este mes ✓</div>';
      h += `<div class="tabs">${[["veh", "🚗 Vehículos"], ["tram", "📋 Trámites"], ["fab", "🏭 Fábrica"]].map(t => `<button class="${tab === t[0] ? "on" : ""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>`;
      if (tab === "veh"){
        if (vsel >= D.veh.length) vsel = 0;
        h += `<div class="seg">${D.veh.map((v, i) => `<button class="${i === vsel ? "on" : ""}" data-vs="${i}">🚗 ${esc(v.n)}</button>`).join("")}<button class="dash" data-a="nveh">＋ Vehículo</button></div>`;
        const v = D.veh[vsel];
        if (v){
          h += `<div class="card"><div class="rr"><b style="font-size:18px;text-align:left">${esc(v.n)}</b><span>${esc(v.pat || "sin patente")} · ${esc(v.zona)}</span></div>
            <div class="rr"><span>Km hoy</span><b>${v.km ? km(v.km) + (v.kmReal ? "" : ' <span class="est">estimado</span>') : "—"}</b></div>
            <div class="rr"><span>Hace por mes</span><b>${v.kmMes ? "~" + km(v.kmMes) : "—"}</b></div>
            ${!v.km ? '<div class="q">Cargá los km del tablero para saber cuándo toca cada service.</div>' : ""}
            <div class="grp">Service</div>
            ${v.svc.length ? v.svc.map(s => { const pct = v.km && s.cadaKm ? Math.min(100, Math.max(0, (v.km - s.ultKm) / s.cadaKm * 100)) : 0;
              return `<button class="it" style="padding:8px 0;background:none;min-height:0;flex-direction:column;align-items:stretch;gap:6px" data-i="${esc(s.id)}"><div class="rr"><span>${esc(s.q)}${s.est ? ' <span class="est">estimado</span>' : ""}</span>${pill(s)}</div>${s.cadaKm ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}<div class="q">Último ${esc(s.ult || "—")}${s.ultKm ? " · " + km(s.ultKm) : ""} · cada ${s.cadaKm ? km(s.cadaKm) : ""}${s.cadaKm && s.cadaM ? " o " : ""}${s.cadaM ? cadaTxt(s.cadaM) : ""}</div></button>`; }).join("") : '<div class="q">Todavía no hay services cargados. Tocá ＋ arriba.</div>'}
            <div class="grp">Papeles</div>
            ${v.venc.length ? v.venc.map(x => `<button class="it" style="padding:6px 0;background:none;min-height:0" data-i="${esc(x.id)}"><span class="t"><b style="font-size:16px">${esc(x.q)}</b></span>${pill(x)}</button>`).join("") : '<div class="q">Seguro, patente, VTV: tocá ＋ arriba.</div>'}
            <button class="btn ol" data-a="km">📍 Cargar los km de hoy</button></div>`;
        }
      } else {
        const L = D.items.filter(x => x.tipo === (tab === "fab" ? "Fábrica" : "Trámite"));
        h += L.length ? L.map(x => `<button class="it" data-i="${esc(x.id)}"><span class="e">${emo(x)}</span><span class="t"><b>${esc(x.q)}</b><span>Vence ${esc(x.f)} · ${cadaTxt(x.cadaM)}</span></span>${pill(x)}</button>`).join("")
          : `<div class="empty">${tab === "fab" ? "Matafuego, ánodo del termotanque, balanza…" : "Habilitaciones, RNPA, libretas…"}<br>se cargan con ＋ a medida que aparecen.</div>`;
      }
    } else if (vista === "item"){
      const x = sel;
      h += `<h1 style="font-size:22px">${emo(x)} ${nom(x)}</h1><div class="card">`;
      if (x.tipo === "Service") h += `<div class="rr"><span>Último</span><b>${esc(x.ult || "—")}${x.ultKm ? " · " + km(x.ultKm) : ""}</b></div><div class="rr"><span>Se hace cada</span><b>${x.cadaKm ? km(x.cadaKm) : ""}${x.cadaKm && x.cadaM ? " o " : ""}${x.cadaM ? cadaTxt(x.cadaM) : ""}</b></div>
        <div class="rr"><span>Toca</span><b>${x.f ? (x.porFecha ? "por fecha, " : "~") + esc(x.f) : "—"}</b></div>${x.est ? '<div class="q"><span class="est">estimado</span>: sale del promedio de km por mes. Con cada km que cargues se ajusta.</div>' : ""}`;
      else h += `<div class="rr"><span>Vence</span><b>${esc(x.f)}</b></div><div class="rr"><span>Se repite</span><b>${cadaTxt(x.cadaM)}</b></div>`;
      h += `<div class="rr"><span>Avisa a</span><b>${esc((x.a && x.a.length ? x.a : ["Lucas"]).map(n => n === "Francisco" ? "Fran" : n).join(", "))}</b></div></div>
        <div class="card"><div class="q">¿Ya lo hiciste?</div>
        <label class="fl">Fecha<input class="txt" id="hf" value="${esc(D.hoy)}" inputmode="numeric"></label>
        ${x.tipo === "Service" ? `<label class="fl">Km del tablero (si lo sabés)<input class="txt" id="hk" inputmode="numeric" placeholder="opcional"></label>` : ""}
        <button class="btn y" data-a="hecho">✓ Ya lo hice</button>
        ${D.admin ? `<a class="btn" href="${esc(GIABA_BASE_URL)}${GIABA_BASE_URL.indexOf("?") === -1 ? "?" : "&"}app=compras">🧾 Cargar lo que salió en Compras ›</a>` : ""}
        <div class="two"><button class="btn ol" data-a="pos1">Recordame en 1 semana</button><button class="btn ol" data-a="editar">Cambiar fecha</button></div>
        <div id="edBox" hidden class="card" style="padding:0"><label class="fl">${x.tipo === "Service" ? "Último service el" : "Vence el"}<input class="txt" id="ef" value="${esc(x.tipo === "Service" ? x.ult : x.vence)}" inputmode="numeric" placeholder="dd/mm/aaaa"></label><button class="btn y" data-a="fechaOk">Guardar fecha</button></div>
        <button class="btn r" data-a="baja">Sacar de la lista</button></div>`;
    } else if (vista === "km"){
      const v = D.veh[vsel];
      h += `<h1 style="font-size:22px">📍 Km de hoy · ${esc(v.n)}</h1><div class="card"><label class="fl">Km del tablero<input class="txt" id="kmIn" inputmode="numeric" placeholder="${v.km ? esc(v.km.toLocaleString("es-AR")) : "ej: 182.000"}"></label>
        ${!v.kmMes ? `<label class="fl">¿Cuántos km hace por mes, más o menos?<input class="txt" id="kmMesIn" inputmode="numeric" placeholder="ej: 1.000"></label>` : ""}
        <div class="q">Aproximado está bien. Con esto se recalculan los km por mes y cuándo toca cada service.</div>
        <button class="btn y" data-a="kmOk">Guardar</button></div>`;
    } else if (vista === "nveh"){
      h += `<h1 style="font-size:22px">🚗 Vehículo nuevo</h1><div class="card"><label class="fl">Nombre<input class="txt" id="vn" placeholder="Ej: Kangoo Sur"></label>
        <label class="fl">Patente<input class="txt" id="vp" placeholder="opcional"></label>
        <div class="q">¿De qué zona?</div><div class="seg" id="vz"><button class="on" data-z="Sur">Sur</button><button data-z="CABA">CABA</button></div>
        <label class="fl">Km del tablero hoy<input class="txt" id="vk" inputmode="numeric" placeholder="opcional"></label>
        <label class="fl">Km por mes, más o menos<input class="txt" id="vm" inputmode="numeric" placeholder="opcional"></label>
        <button class="btn y" data-a="vehOk">Agregar vehículo</button></div>`;
    } else if (vista === "nuevo"){
      const n = nuevo, porKm = n.de === "veh" && n.cadaKm;
      h += `<h1 style="font-size:22px">Nuevo vencimiento</h1><div class="card"><div class="q">¿De qué es?</div><div class="seg">${[["tram", "📋 Trámite"], ["fab", "🏭 Fábrica"], ["veh", "🚗 Vehículo"]].map(t => `<button class="${n.de === t[0] ? "on" : ""}" data-de="${t[0]}">${t[1]}</button>`).join("")}</div>
        ${n.de === "veh" ? `<div class="q">¿De qué vehículo?</div><div class="seg">${D.veh.map((v, i) => `<button class="${n.veh === i ? "on" : ""}" data-nv="${i}">🚗 ${esc(v.n)}</button>`).join("")}</div>` : ""}
        <div class="q">¿Qué es?</div><div class="seg">${EJ[n.de].map(x => `<button class="${n.q === x ? "on" : ""}" data-ej="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <label class="fl">O escribilo<input class="txt" id="nq" value="${esc(n.q)}" placeholder="Ej: ${esc(EJ[n.de][0])}"></label>
        ${n.de === "veh" ? `<label class="fl">Cada cuántos km (si va por km)<input class="txt" id="nck" inputmode="numeric" value="${n.cadaKm || ""}" placeholder="vacío = va por fecha"></label>` : ""}
        <label class="fl">${porKm ? "La última vez fue el" : "Vence el"}<input class="txt" id="nf" value="${esc(n.f)}" inputmode="numeric" placeholder="dd/mm/aaaa"></label>
        ${porKm ? `<label class="fl">Km de esa vez (si lo sabés)<input class="txt" id="nuk" inputmode="numeric" value="${n.ultKm || ""}" placeholder="opcional"></label>` : ""}
        <div class="q">${porKm ? "O cada (lo que llegue primero)" : "Se repite cada"}</div><div class="seg">${CADA.map(c => `<button class="${n.cada === c[0] ? "on" : ""}" data-cada="${c[0]}">${c[1]}</button>`).join("")}</div>
        <div class="q">Avisar a</div><div class="seg">${GENTE.map(g => `<button class="${n.a.indexOf(g[0]) !== -1 ? "on" : ""}" data-av="${g[0]}">${g[1]}</button>`).join("")}</div>
        <button class="btn y" data-a="crear">Agregar</button></div>`;
    }
    el("app").innerHTML = h;
    const bk = el("bk"); if (vista !== "inicio") bk.onclick = e => { e.preventDefault(); vista = "inicio"; pintar(); window.scrollTo(0, 0); };
  }
  async function guardar(p, despues){
    if (ocupado) return; ocupado = true;
    const r = await run("mantGuardar", p); ocupado = false;
    if (!r || r.status !== "ok"){ toast(r && r.msg ? r.msg : r && r.status === "denegado" ? "No tenés acceso" : "Sin conexión · no se guardó"); return; }
    D = Object.assign(D, { hoy: r.hoy, veh: r.veh, items: r.items }); if (despues) despues(); vista = "inicio"; pintar(); window.scrollTo(0, 0); toast(r.msg || "Guardado");
  }
  const val = id => el(id) ? el(id).value : "";
  document.addEventListener("input", e => { if (!nuevo) return; const t = e.target.id;
    if (t === "nq") nuevo.q = e.target.value; if (t === "nf") nuevo.f = e.target.value; if (t === "nuk") nuevo.ultKm = e.target.value;
    if (t === "nck"){ const antes = !!nuevo.cadaKm; nuevo.cadaKm = +String(e.target.value).replace(/\D/g, "") || 0; if (antes !== !!nuevo.cadaKm){ pintar(); const i = el("nck"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } });
  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t || !D) return;
    if (t.dataset.t){ tab = t.dataset.t; lsSet("mant_tab", tab); pintar(); return; }
    if (t.dataset.vs != null){ vsel = +t.dataset.vs; pintar(); return; }
    if (t.dataset.i){ sel = D.items.find(x => x.id === t.dataset.i); if (sel){ vista = "item"; pintar(); window.scrollTo(0, 0); } return; }
    if (t.dataset.de){ nuevo.de = t.dataset.de; if (EJ[nuevo.de].indexOf(nuevo.q) === -1 && Object.keys(EJ).some(k => EJ[k].indexOf(nuevo.q) !== -1)) nuevo.q = ""; if (nuevo.de !== "veh") nuevo.cadaKm = 0; pintar(); return; }
    if (t.dataset.ej){ nuevo.q = t.dataset.ej; const pk = nuevo.de === "veh" && POR_KM[nuevo.q]; if (pk){ nuevo.cadaKm = pk[0]; nuevo.cada = pk[1]; } else if (nuevo.de === "veh") nuevo.cadaKm = 0; pintar(); return; }
    if (t.dataset.nv != null){ nuevo.veh = +t.dataset.nv; pintar(); return; }
    if (t.dataset.cada != null){ nuevo.cada = +t.dataset.cada; pintar(); return; }
    if (t.dataset.av){ const q = t.dataset.av; nuevo.a = nuevo.a.indexOf(q) !== -1 ? nuevo.a.filter(x => x !== q) : nuevo.a.concat([q]); pintar(); return; }
    if (t.dataset.z){ document.querySelectorAll("#vz button").forEach(b => b.classList.toggle("on", b === t)); return; }
    const a = t.dataset.a; if (!a) return;
    if (a === "nuevo"){ nuevo = { de: tab, q: "", f: "", cada: 12, cadaKm: 0, ultKm: "", a: [A.nombre === "Francisco" ? "Francisco" : "Lucas"], veh: vsel }; vista = "nuevo"; pintar(); window.scrollTo(0, 0); return; }
    if (a === "km"){ vista = "km"; pintar(); return; }
    if (a === "nveh"){ vista = "nveh"; pintar(); return; }
    if (a === "kmOk"){ const v = D.veh[vsel]; guardar({ acc: "km", id: v.id, km: val("kmIn"), kmMes: el("kmMesIn") ? val("kmMesIn") : null }); return; }
    if (a === "vehOk"){ const z = document.querySelector("#vz button.on"); guardar({ acc: "veh", n: val("vn"), pat: val("vp"), zona: z ? z.dataset.z : "Sur", km: val("vk"), kmMes: val("vm") }, () => { vsel = D.veh.length - 1; tab = "veh"; }); return; }
    if (a === "crear"){ const n = nuevo, v = D.veh[n.veh];
      guardar({ acc: "nuevo", de: n.de, veh: v ? v.id : "", q: n.q, f: n.f, cada: n.cada, cadaKm: n.de === "veh" ? n.cadaKm : 0, ultKm: n.ultKm, a: n.a }, () => { tab = n.de; if (n.de === "veh") vsel = n.veh; nuevo = null; }); return; }
    if (a === "hecho"){ guardar({ acc: "hecho", id: sel.id, f: val("hf"), km: val("hk") }); return; }
    if (a === "pos1"){ guardar({ acc: "posponer", id: sel.id }); return; }
    if (a === "editar"){ el("edBox").hidden = !el("edBox").hidden; return; }
    if (a === "fechaOk"){ guardar({ acc: "fecha", id: sel.id, f: val("ef") }); return; }
    if (a === "baja"){ if (t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "Tocá de nuevo para sacarlo"; return; } guardar({ acc: "baja", id: sel.id }); return; }
  });
  if (!A || !A.pin){ el("app").innerHTML = `<div class="top"><a class="back" href="${esc(GIABA_BASE_URL)}">${SV}Menú</a></div><div class="empty">Entrá desde el menú con tu PIN.</div>`; return; }
  pintar();
  run("getMantenimiento").then(r => {
    if (!r || r.status !== "ok"){ el("app").innerHTML = `<div class="top"><a class="back" href="${esc(GIABA_BASE_URL)}">${SV}Menú</a></div><div class="empty">${r && r.status === "denegado" ? "Mantenimiento es para Lucas, Adriana y Fran." : "Sin conexión. Probá de nuevo en un rato."}</div>`; return; }
    D = r; pintar();
  });
})();
</script>
</body>
</html>
