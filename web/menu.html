<body>
<!-- 09/11/2026 (Lucas): «cuando apretamos cualquier botón tiene que pasar algo». Va incluido en TODAS las pantallas (include('BotonesComun')).
     1) Al tocar: el botón se hunde y se ilumina al instante (antes de que conteste el servidor).
     2) Si ese toque llama al servidor: el botón queda «trabajando» (pulso + puntitos) y no se puede volver a tocar hasta que conteste.
     3) Si tarda más de medio segundo: barrita arriba y cartelito «Cargando…» abajo, para que se note que la app está haciendo algo.
     No cambia ningún texto ni ninguna función de las pantallas: solo se engancha a google.script.run. -->
<style>

.gb-busy::after { content: "…"; position: absolute; right: 10px; top: 50%; transform: translateY(-58%); font-weight: 800; letter-spacing: 1px; animation: gbPts 1s steps(3) infinite; }
@keyframes gbPulso { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
@keyframes gbPts { 0% { opacity: .3; } 50% { opacity: 1; } 100% { opacity: .3; } }
#gbBarra { position: fixed; left: 0; top: 0; height: 4px; width: 0; background: #ffd100; z-index: 99999; transition: width .25s ease, opacity .3s; opacity: 0; pointer-events: none; }
#gbBarra.on { opacity: 1; width: 75%; transition: width 6s cubic-bezier(.1, .7, .2, 1), opacity .2s; }
#gbCartel { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2a2a2b; color: #f5efe8; border: 2px solid #ffd100; border-radius: 999px; padding: 6px 14px; font: 700 15px/1.2 Manrope, system-ui, sans-serif; z-index: 99998; opacity: 0; pointer-events: none; transition: opacity .2s; }
#gbCartel.on { opacity: 1; }
</style>
<script>
(function () {

  function tap(b, fn){
    if (!window.PointerEvent){ b.addEventListener("click", fn); return; }

    b.addEventListener("pointerdown", function(e){ if (e.pointerType === "mouse" && e.button !== 0) return; st = { x: e.clientX, y: e.clientY }; b.classList.add("pressed"); });

      }

  // numerito de incidentes abiertos (primero lo guardado, después lo real)
  function pintarBadge(n){
    document.querySelectorAll("[data-inc]").forEach(function(b){ b.hidden = !(n > 0); b.textContent = n; });
    sumarGrupos(); if (window.GIABA_NAV && GIABA_NAV.refrescar) GIABA_NAV.refrescar();
  }
  let badgePedido = false;
  function actualizarBadge(){
    const c = lsGet("inc_badge", null);
    if (c) pintarBadge(c.abiertos);
    if (badgePedido || typeof google === "undefined" || !google.script) return;
    badgePedido = true;
    google.script.run.withSuccessHandler(function(res){
      badgePedido = false;
      if (res && res.status === 'ok'){ lsSet("inc_badge", { abiertos: res.abiertos, urgentes: res.urgentes }); pintarBadge(res.abiertos); }
    }).withFailureHandler(function(){ badgePedido = false; }).getResumenIncidentes((lsGet("giaba_auth", null) || {}).nombre, (lsGet("giaba_auth", null) || {}).pin);   // 29/10 (rev): con nombre + PIN
  }

  // ---- boot ----
  renderQuienGrid();
  var authGuardada = lsGet("giaba_auth", null);
  // 02/11: «Cambiar de persona» desde el menú (☰ o barra) de cualquier app → llega acá y pide el PIN de esa persona
  var cambiarA = lsGet("giaba_cambiar", null);
  try { localStorage.removeItem("giaba_cambiar"); } catch (e) {}
  if (cambiarA && cambiarA.n && Date.now() - (cambiarA.t || 0) < 120000){
    openPinScreen(String(cambiarA.n));
  } else if (authGuardada && authGuardada.nombre && authGuardada.apps && authGuardada.apps.length){
    irAlDestino(authGuardada.nombre, authGuardada.apps);
    if (typeof google !== "undefined" && google.script && authGuardada.pin){
      google.script.run.withSuccessHandler(function(res){
        if (res && res.status === 'ok'){
          if (!sigue(authGuardada.nombre)) return;
          lsSet("giaba_auth", { nombre: authGuardada.nombre, pin: authGuardada.pin, apps: res.apps, zona: res.zona, ts: Date.now() });
          irAlDestino(authGuardada.nombre, res.apps);
        } else if (res && ['denegado','sin_pin','no_encontrado'].indexOf(res.status) !== -1){
          lsSet("giaba_auth", null);
          showScreen("quien");
        }
      }).withFailureHandler(function(){ /* sin señal: queda con lo guardado */ })
        .validarAcceso(authGuardada.nombre, authGuardada.pin);
    }
  } else {
    showScreen("quien");
  }
  // ---- respuesta al toque: se ilumina la tecla y vibra apenas (si el celu deja) ----
  document.addEventListener("touchstart", function(){}, { passive: true });
  document.addEventListener("pointerdown", function(e){
    const k = e.target.closest && e.target.closest(".key,.pay-btn,.choice-btn,.menu-card");
    if (!k || k.classList.contains("blank")) return;
    k.classList.add("pressed");
    if (k.classList.contains("key")){ try { if (navigator.vibrate) navigator.vibrate(10); } catch(_){} }
    setTimeout(function(){ k.classList.remove("pressed"); }, 170);
  }, { passive: true });
})();
</script>
</body>
