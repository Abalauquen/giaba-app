<script>

        var args = [].slice.call(arguments), clave = null, okL = ok, failL = fail;

  let R = null, DIAS = [], FERIAS = [], S = { fer: null, scr: "c1", dia: null, hora: null, wa: "", edWa: 0, enviando: 0, segCancel: 0 };
  const dn = f => DIAS.filter(function(d){ return d.fecha === f; })[0];
  function libre(f, h){ const d = dn(f); return !!(d && d.horas.indexOf(h) !== -1); }

  function err(){
    const wa = "https:\/\/wa.me\/" + WSP + "?text=" + encodeURIComponent("¡Hola! Quiero elegir el día para retirar mi pedido por Saavedra y el link no me funcionó.");
    return '<span class="step">Depósito Abalauquen · Saavedra</span><h1>¡Hola! 👋</h1>'
      + '<div class="card"><span class="hint" style="font-size:16px">Uy, no encontramos tu pedido con este link 🙈. Puede que se haya cortado al copiarlo.</span><span class="hint">Escribinos por WhatsApp o por mail y te ayudamos a elegir el día y la hora enseguida 😊</span></div>'
      + '<a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">💬 Escribinos por WhatsApp</a>'
      + '<a class="btn" href="mailto:' + MAIL + '?subject=' + encodeURIComponent("Retiro de mi pedido") + '">✉️ ' + MAIL + '</a>';
  }
  function fin(txt){
    return '<span class="step">Depósito Abalauquen · Saavedra</span><h1>¡Hola' + (R.primer ? " " + esc(R.primer) : "") + '! 👋</h1>'
      + '<div class="card"><div class="card-t"><span>🫙 Pedido ' + esc(R.ped) + '</span></div><span class="hint" style="font-size:16px">' + txt + '</span></div>'
      + '<a class="btn wa" href="https:\/\/wa.me\/' + WSP + '" target="_blank" rel="noopener">💬 Escribinos por WhatsApp</a>';
  }
  function c1(){
    if (R.estado === "Retiró") return fin("¡Ya retiraste este pedido! Muchas gracias por elegirnos 💛");
    if (R.estado === "Pedido cancelado") return fin("Este pedido figura cancelado. Si es un error, escribinos y lo vemos juntos 😊");
    return '<h1>¡Hola' + (R.primer ? " " + esc(R.primer) : "") + '! 👋</h1><div class="sub">' + (R.soloDep ? 'Elegí cuándo pasar a buscar tu pedido por nuestro depósito de Saavedra.' : 'Tu pedido ya está listo. ¿Dónde preferís pasar a buscarlo?') + '</div>'
      + '<div class="card"><div class="card-t"><span>🫙 Pedido ' + esc(R.ped) + '</span><small>' + esc(R.comprado) + '</small></div>' + (R.items ? '<span class="hint">' + esc(R.items) + '</span>' : '')
      + '<div class="hint">' + (R.nombre ? 'A nombre de <b>' + esc(R.nombre) + '</b> · ' : '') + 'WhatsApp <b>' + esc(S.wa || "—") + '</b> <button class="btn sm" style="display:inline-flex;min-height:40px;margin-left:6px" data-edwa>Cambiar</button></div>'
      + (S.edWa ? '<input class="inp" id="iWa" inputmode="tel" value="' + esc(S.wa) + '" placeholder="11 5555-1234">' : '') + '</div>'
      + '<button class="opt" data-go="c2"><span class="row"><span class="ic">🏠</span><span style="flex:1"><b>Depósito Saavedra</b><span class="hint">Lunes a viernes · 10 a 13 h y 15 a 19 h · elegís día y hora</span></span><span style="font-size:22px;font-weight:800;color:var(--ink-soft)">›</span></span></button>'
      + (R.soloDep ? '' : '<button class="opt" data-go="f2"><span class="row"><span class="ic">🎪</span><span style="flex:1"><b>En una feria</b><span class="hint">Elegís una de las ferias de estos días y pasás por nuestro puesto</span></span><span style="font-size:22px;font-weight:800;color:var(--ink-soft)">›</span></span></button>')
      + '<div class="hint">Todo viene cargado desde tu compra' + (R.soloDep ? ' en Mercado Libre' : ' en la tienda') + ': no tenés que completar nada.</div>';
  }
  // 06/11 (mockup-retiros-feria): retirar en una feria
  const fn = id => FERIAS.filter(function(f){ return f.id === id; })[0];
  function f2(){
    let h = '<div class="top"><button class="back" data-go="' + (R.vigente ? "c4" : "c1") + '">‹ Volver</button><span class="step">' + esc(R.ped) + '</span></div><h2>¿En qué feria pasás?</h2><div class="sub">Estas son las ferias donde vamos a estar con tu pedido. Pasá por el puesto de Abalauquen en el horario de la feria.</div>';
    let dia = "";
    FERIAS.forEach(function(f){ const on = S.fer === f.id;
      if (f.fecha !== dia){ dia = f.fecha; h += '<div class="grp">' + esc(f.t) + '</div>'; }
      h += '<button class="fr' + (on ? " on" : "") + '" data-fer="' + esc(f.id) + '"><span style="width:26px;height:26px;border-radius:13px;border:2px solid ' + (on ? "var(--accent);background:var(--accent)" : "var(--line-2)") + ';flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900">' + (on ? "✓" : "") + '</span><span class="t"><b>' + esc(f.nombre) + '</b><span>' + esc(f.horario) + '</span></span></button>';
    });
    if (!FERIAS.length) h += '<div class="wrb">Por ahora no tenemos ferias confirmadas para estos días 🙈. Volvé a entrar más adelante con este mismo link, o elegí el depósito de Saavedra.</div>';
    h += '<div class="info">📅 Te mostramos las ferias de esta semana y la próxima, porque <b>cada organización las va confirmando</b> sobre la marcha. Si ninguna te queda cómoda, <b>volvé a entrar más adelante con este mismo link</b> y vas a ver las nuevas fechas 😊</div>';
    h += '<button class="btn ' + (S.fer && fn(S.fer) ? "y" : "off") + '" ' + (S.fer && fn(S.fer) ? 'data-go="f3"' : '') + '>Seguir ›</button>'; return h; }
  function ferCard(f){ return '<div class="card" style="border:2px solid var(--accent)"><div class="card-t">🎪 ' + esc(f.t || R.diaTxt) + (f.horario ? ' · ' + esc(f.horario) : '') + '</div><div style="font-size:18px;font-weight:800;line-height:1.35">Feria ' + esc(f.nombre) + '</div><span class="hint">Buscá el puesto de <b>Abalauquen</b> y decí tu nombre o tu n° de pedido: lo llevamos armado.</span>' + (f.maps ? '<a class="btn ol" href="' + esc(f.maps) + '" target="_blank" rel="noopener">🗺️ Cómo llegar (Google Maps)</a>' : '') + '</div>'; }
  function f3(){ const f = fn(S.fer); if (!f){ S.scr = "f2"; return f2(); }
    return '<div class="top"><button class="back" data-go="f2">‹ Volver</button><span class="step">Revisá y confirmá</span></div><h2>Tu retiro</h2>' + ferCard(f)
    + '<div class="card"><div class="hint">Pedido <b>' + esc(R.ped) + '</b>' + (R.nombre ? ' · ' + esc(R.nombre) : '') + '</div></div>'
    + '<div class="card" style="border-left:6px solid var(--blue)"><span class="hint">Las ferias dependen de cada organización y del clima. <b>Si se suspende, te avisamos por mail</b> para que elijas otra feria o el depósito. Si no te avisamos, ¡te esperamos! 😊</span></div>'
    + '<div class="errm" id="e3"></div>'
    + '<button class="btn ' + (S.enviando ? "off" : "y") + '" data-reservar="f">' + (S.enviando ? "Reservando…" : "✓ Confirmar retiro en la feria") + '</button>'; }
  function c2(){
    let h = '<div class="top"><button class="back" data-go="' + (R.vigente ? "c4" : "c1") + '">‹ Volver</button><span class="step">' + esc(R.ped) + '</span></div><h2>¿Cuándo pasás?</h2><div class="sub">Tocá el día y elegí la hora. Abrimos de lunes a viernes; podés elegir de hoy hasta el viernes que viene.</div>';
    DIAS.forEach(function(d){ const ok = d.horas.length > 0, on = S.dia === d.fecha;
      h += '<div class="card" style="padding:0;gap:0;' + (on ? 'border:2px solid var(--accent)' : '') + (ok ? '' : ';opacity:.5') + '"><button class="chip" style="width:100%;border:0;justify-content:space-between;min-height:56px;' + (on ? 'background:var(--accent-soft);color:#7a5c00' : '') + '" ' + (ok ? 'data-dia="' + d.fecha + '"' : 'disabled') + '><span>' + esc(d.t) + '</span><small>' + (ok ? (on ? "▲" : d.horas.length + " horario" + (d.horas.length === 1 ? "" : "s") + " ▾") : esc(d.motivo || "cerrado")) + '</small></button>';
      if (on) h += '<div style="padding:12px;display:flex;flex-direction:column;gap:8px">' + [["Mañana","10 a 13 h",d.horas.filter(man)],["Tarde","15 a 19 h",d.horas.filter(function(x){ return !man(x); })]].map(function(t){ const c = t[2].map(hb).join(""); return c ? '<div class="lbl">' + t[0] + ' <small>' + t[1] + '</small></div><div class="chips">' + c + '</div>' : ''; }).join("") + '</div>';
      h += '</div>'; });
    if (!DIAS.some(function(d){ return d.horas.length; })) h += '<div class="wrb">Por ahora no tenemos horarios libres 🙈. Escribinos por WhatsApp y lo coordinamos.</div>';
    h += '<div class="hint">Necesitamos un ratito para preparar tu pedido: por eso los horarios arrancan 2 horas después de que entrás, y si compraste hoy, podés pasar desde mañana.</div>';
    h += '<button class="btn ' + (S.dia && S.hora ? "y" : "off") + '" ' + (S.dia && S.hora ? 'data-go="c3"' : '') + '>Seguir ›</button>'; return h; }
  function hb(x){ return '<button class="chip ' + (S.hora === x ? "on" : "") + '" data-hora="' + x + '">' + x + '</button>'; }
  function c3(){ const d = dn(S.dia); return '<div class="top"><button class="back" data-go="c2">‹ Volver</button><span class="step">Revisá y confirmá</span></div><h2>Tu retiro</h2>'
    + '<div class="card"><div class="card-t">🗓️ ' + esc(d ? d.t : S.dia) + ' · ' + hTxt(S.hora) + '</div><div class="hint">Pedido <b>' + esc(R.ped) + '</b>' + (R.nombre ? ' · ' + esc(R.nombre) : '') + '</div></div>' + DIR
    + '<div class="card" style="border-left:6px solid var(--blue)"><span class="hint">Tu turno queda <b>sujeto a confirmación</b>. Si ese día se nos complica, te escribimos por WhatsApp para buscar otro horario que te quede cómodo. Si no te escribimos, ¡te esperamos! 😊</span></div>'
    + '<div class="errm" id="e3"></div>'
    + '<button class="btn ' + (S.enviando ? "off" : "y") + '" data-reservar>' + (S.enviando ? "Reservando…" : "✓ Reservar mi retiro") + '</button>'; }
  function c4(){ const F = R.feria; return '<div style="font-size:56px;text-align:center">🎉</div><h1 style="text-align:center">¡Listo! Te esperamos' + (F ? ' en la feria' : '') + '</h1><div class="sub" style="text-align:center;margin-top:0">' + esc(R.diaTxt) + (F ? (F.horario ? ' · de ' + esc(F.horario) : '') : ' a las ' + esc(R.horaTxt)) + '</div>' + (F ? ferCard({ t: R.diaTxt, horario: F.horario, nombre: F.nombre, maps: F.maps }) : DIR)
    + '<div class="card" style="border-left:6px solid var(--good)"><span class="hint">Te mandamos todo esto por mail. Si algo cambia, te avisamos por mail para que elijas de nuevo. ¡Gracias por elegirnos! 💛</span></div>'
    + '<button class="btn ol" data-go="c1">Cambiar día o lugar</button><button class="btn ' + (S.segCancel ? "rf" : "r") + '" data-cancel>' + (S.segCancel ? (S.enviando ? "Cancelando…" : "¿Seguro? Tocá de nuevo para cancelar") : "No puedo ir · cancelar") + '</button>'; }

  // 06/11 (Lucas): link general (sin mail): N° de pedido, quién retira y WhatsApp → sigue igual que el link del mail
  function nuevo(){ const wa = "https:\/\/wa.me\/" + WSP;
    return '<span class="step">Depósito Abalauquen · Saavedra</span><h1>¡Hola! Elegí cuándo pasás a buscar tu pedido 🫙</h1><div class="sub">Completá estos datos y en el paso siguiente elegís el día y la hora.</div>'
      + '<div class="card"><span class="lbl">N° de pedido <small>está en el mail de tu compra, ej. #1218</small></span><input class="inp" id="nPed" inputmode="numeric" value="' + esc(S.nPed || "") + '">'
      + '<span class="lbl">¿Quién retira?</span><input class="inp" id="nNom" autocomplete="name" value="' + esc(S.nNom || "") + '">'
      + '<span class="lbl">Tu WhatsApp <small>por si necesitamos avisarte algo</small></span><input class="inp" id="nWa" inputmode="tel" autocomplete="tel" value="' + esc(S.nWa || "") + '"></div>'
      + (S.nMsg ? '<div class="' + (S.nYa ? "info" : "wrb") + '">' + esc(S.nMsg) + '</div>' + (S.nYa || S.nWsp ? '<a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">💬 Escribinos por WhatsApp</a>' : '') : '')
      + '<button class="btn y' + (S.enviando ? " off" : "") + '" data-nuevo>' + (S.enviando ? "Buscando tu pedido…" : "Elegir día y hora ›") + '</button>'; }
  function buscarNuevo(){
    if (S.enviando || !gs()) return;
    S.nPed = el("nPed").value; S.nNom = el("nNom").value; S.nWa = el("nWa").value; S.nMsg = ""; S.nYa = 0; S.nWsp = 0; S.enviando = 1; draw(false);
    google.script.run.withSuccessHandler(function(r){ S.enviando = 0;
      if (r && r.status === "ok"){ RID = r.id; TOKEN = r.t; S.scr = "c1"; R = null; cargar(); return; }
      S.nMsg = (r && r.msg) || "No se pudo. Probá de nuevo."; S.nYa = r && r.status === "ya" ? 1 : 0; S.nWsp = r && r.wsp ? 1 : 0; draw(false);
    }).withFailureHandler(function(){ S.enviando = 0; S.nMsg = "Sin conexión. Probá de nuevo en un ratito."; draw(false); }).retNuevoPublico({ pedido: S.nPed, nombre: S.nNom, wa: S.nWa });
  }
  function draw(top){ const f = { c1: c1, c2: c2, c3: c3, c4: c4, f2: f2, f3: f3, err: err, nuevo: nuevo }[S.scr]; el("app").innerHTML = f(); bind(); if (top !== false) window.scrollTo(0,0); }
  function leerWa(){ const w = el("iWa"); if (w) S.wa = w.value.trim(); }
  function bind(){ const q = s => document.querySelectorAll(s);
    q("[data-go]").forEach(function(b){ b.onclick = function(){ leerWa();
      if ((b.dataset.go === "c2" || b.dataset.go === "f2") && S.wa.replace(/\D/g, "").length < 8){ S.edWa = 1; S.scr = "c1"; draw(); toast("Revisá tu WhatsApp: tiene que tener al menos 8 números"); return; }
      S.segCancel = 0; S.scr = b.dataset.go; draw(); }; });
    q("[data-dia]").forEach(function(b){ b.onclick = function(){ S.dia = S.dia === b.dataset.dia ? null : b.dataset.dia; if (S.hora && !libre(S.dia, S.hora)) S.hora = null; draw(false); }; });
    q("[data-fer]").forEach(function(b){ b.onclick = function(){ S.fer = b.dataset.fer; draw(false); }; });
    q("[data-hora]").forEach(function(b){ b.onclick = function(){ S.hora = b.dataset.hora; draw(false); }; });
    q("[data-edwa]").forEach(function(b){ b.onclick = function(){ S.edWa = 1; draw(false); const i = el("iWa"); if (i) i.focus(); }; });
    q("[data-reservar]").forEach(function(b){ b.onclick = function(){ reservar(b.dataset.reservar === "f"); }; });
    q("[data-cancel]").forEach(function(b){ b.onclick = cancelar; });
    q("[data-nuevo]").forEach(function(b){ b.onclick = buscarNuevo; });
  }
  function aplicar(r){ R = r.r; if (r.dias) DIAS = r.dias; if (r.ferias) FERIAS = r.ferias; S.wa = R.wa || ""; }
  function reservar(enFeria){
    if (S.enviando || !gs()) return;
    S.enviando = 1; draw(false);
    google.script.run.withSuccessHandler(function(r){
      S.enviando = 0;
      if (r && r.status === "ok"){ R = r.r; S.wa = R.wa || S.wa; S.scr = "c4"; draw(); toast(r.cambio ? "¡Listo! Cambiamos tu retiro" : "¡Listo! Reservamos tu retiro"); return; }
      if (r && r.ferias){ FERIAS = r.ferias; S.fer = null; S.scr = "f2"; draw(); toast((r && r.msg) || "Elegí otra feria"); return; }
      if (r && r.dias){ DIAS = r.dias; if (!libre(S.dia, S.hora)) S.hora = null; S.scr = "c2"; draw(); toast((r && r.msg) || "Elegí otro horario"); return; }
      draw(false); el("e3").textContent = (r && r.msg) || "No se pudo reservar. Probá de nuevo.";
    }).withFailureHandler(function(){ S.enviando = 0; draw(false); el("e3").textContent = "Sin conexión. Probá de nuevo en un ratito."; })
      .reservarRetiro(enFeria ? { id: RID, t: TOKEN, feria: S.fer, wa: S.wa } : { id: RID, t: TOKEN, fecha: S.dia, hora: S.hora, wa: S.wa });
  }
  function cancelar(){
    if (!S.segCancel){ S.segCancel = 1; draw(false); return; }
    if (S.enviando || !gs()) return;
    S.enviando = 1; draw(false);
    google.script.run.withSuccessHandler(function(r){
      S.enviando = 0; S.segCancel = 0;
      if (r && r.status === "ok"){ R = r.r; S.dia = null; S.hora = null; S.scr = "c1"; draw(); cargar(); toast("Listo, cancelamos tu retiro. Cuando puedas, elegí otro día 😊"); return; }
      draw(false); toast((r && r.msg) || "No se pudo cancelar");
    }).withFailureHandler(function(){ S.enviando = 0; S.segCancel = 0; draw(false); toast("Sin conexión. Probá de nuevo."); }).cancelarRetiro(RID, TOKEN);
  }
  function cargar(){
    if (!gs()) return;
    google.script.run.withSuccessHandler(function(r){
      if (!r || r.status !== "ok"){ S.scr = "err"; draw(); return; }
      const primera = !R; aplicar(r);
      if (primera){ S.scr = R.vigente ? "c4" : "c1"; if (R.vigente && R.feria) S.fer = R.feria.id; else if (R.vigente && libre(R.fecha, R.hora)){ S.dia = R.fecha; S.hora = R.hora; } }
      draw();
    }).withFailureHandler(function(){ el("app").innerHTML = '<div class="wrb">Sin conexión. Probá de nuevo en un ratito.</div>'; }).getRetiroPublico(RID, TOKEN);
  }
  if (RID === "nuevo"){ S.scr = "nuevo"; draw(); } else if (!RID || !TOKEN){ S.scr = "err"; draw(); } else cargar();
})();
</script>
</body>
</html>
